services:
  postgres:
    image: postgres:16-alpine
    container_name: andon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: andon_support
      POSTGRES_USER: andon_user
      POSTGRES_PASSWORD: andon_pass
    ports:
      - "5432:5432"
    volumes:
      - andon_pgdata:/var/lib/postgresql/data
volumes:
  andon_pgdata:
